<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  
  <!-- SEO & Brand Metadata -->
  <title>GeoBiz — Business Opportunity Intelligence</title>
  <meta name="description" content="Find verified business opportunities tailored to your location, capital, and skills across India.">
  <meta name="theme-color" content="#090d16">
  
  <!-- OpenGraph / Social Share Metadata -->
  <meta property="og:title" content="GeoBiz | Business Opportunity Intelligence">
  <meta property="og:description" content="Discover high-margin local ventures verified through direct mandi audits.">
  <meta property="og:type" content="website">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Full-Screen Embedded Web App Frame */
    #storeFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #090d16;
    }

    /* Institutional Preloader */
    #loader {
      position: fixed;
      inset: 0;
      background: #090d16;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .brand-loader {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 800;
      background: conic-gradient(from 210deg, #2563eb, #059669, #f59e0b, #ef4444, #2563eb);
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .loader-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-top: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .loaded #loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Branded Preloader -->
  <div id="loader">
    <div class="brand-loader">
      <div class="brand-mark">G</div>
      GeoBiz
    </div>
    <div class="spinner"></div>
    <div class="loader-text">Connecting to Territory Intelligence Engine…</div>
  </div>

  <!-- Google Apps Script Fullscreen Frame -->
  <iframe 
    id="storeFrame" 
    src="" 
    allow="geolocation; camera; microphone; clipboard-write; payment" 
    title="GeoBiz Terminal">
  </iframe>

  <script>
    // 1. Your Google Apps Script Web App URL
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbykzUbZR6Sy1PmvC2PKqTBfwrKRRHKAxNdE7AqApE3px2EmVgNUMg0Rv81J4ekEdAXAgg/exec";

    // 2. Forward Query Parameters and Route Hashes (e.g. #explore or ?id=1)
    const currentParams = window.location.search;
    const currentHash = window.location.hash;
    const targetUrl = APPS_SCRIPT_WEBAPP_URL + (currentParams ? currentParams : '') + (currentHash ? currentHash : '');

    const iframe = document.getElementById('storeFrame');
    iframe.src = targetUrl;

    // Remove preloader once Google Apps Script finishes rendering
    iframe.onload = function() {
      document.body.classList.add('loaded');
    };

    // Safety fallback: remove loader after 3.5s
    setTimeout(function() {
      document.body.classList.add('loaded');
    }, 3500);
  </script>
</body>
</html>
